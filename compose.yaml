services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: inventory-app:local
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: .
    image: inventory-app:local
    command: ["node", "dist/src/workers/reportWorker.js"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
